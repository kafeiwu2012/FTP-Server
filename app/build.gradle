plugins { id 'com.android.application' }
android {
    namespace 'com.lanftp'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'com.lanftp'; minSdk 21; targetSdk 35; versionCode 9; versionName '3.3.1'; testInstrumentationRunner 'com.lanftp.SmokeInstrumentation' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
